<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>42</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<h1>Color Palette</h1>
		<div class="Palette-container">
			<div class="colors">
				<p>Colored text with background and 0.3 opacity</p>
			</div>
			<div class="hex">
				<p>This will display "#ff0000" HEX code</p>
			</div>
			<div class="rgbt">
				<p>This line displays RGB(0, 200, 0 )</p>
			</div>
			<div class="alpha">
				<p>This line uses RGBA(0, 0, 180, 0.5)</p>
			</div>
		</div>
	</body>
</html>
